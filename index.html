<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beast Machine — Desarrollo de Productos Digitales</title>
  <meta name="description" content="Beast Machine desarrolla productos digitales de alto impacto. Apps, plataformas y soluciones a medida.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cyan: #00AEEF;
      --navy: #2D3E50;
      --dark: #0B1A2B;
      --white: #FFFFFF;
      --gray: #8899AA;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 174, 239, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 174, 239, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    header {
      padding: 32px 0;
      text-align: center;
    }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 100px);
      text-align: center;
      padding: 40px 0;
    }

    .logo {
      width: 180px;
      height: 180px;
      border-radius: 24px;
      object-fit: cover;
      margin-bottom: 32px;
      filter: drop-shadow(0 0 40px rgba(0, 174, 239, 0.2));
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 16px;
    }

    h1 span {
      color: var(--cyan);
    }

    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--gray);
      max-width: 500px;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    /* Services */
    .services {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 48px;
      width: 100%;
    }

    .service {
      background: rgba(45, 62, 80, 0.3);
      border: 1px solid rgba(0, 174, 239, 0.1);
      border-radius: 12px;
      padding: 24px 16px;
      text-align: center;
      transition: border-color 0.3s;
    }

    .service:hover {
      border-color: rgba(0, 174, 239, 0.4);
    }

    .service-icon {
      font-size: 28px;
      margin-bottom: 12px;
      display: block;
    }

    .service h3 {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--white);
      letter-spacing: 0.02em;
    }

    /* CTA */
    .cta-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--cyan);
      color: var(--dark);
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 32px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.3s, transform 0.2s;
    }

    .cta-link:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .cta-link svg {
      width: 18px;
      height: 18px;
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 40px 0;
      color: var(--gray);
      font-size: 0.8rem;
      border-top: 1px solid rgba(0, 174, 239, 0.08);
      margin-top: 40px;
    }

    @media (max-width: 500px) {
      .services {
        grid-template-columns: 1fr;
      }
      .logo {
        width: 140px;
        height: 140px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <section class="hero">
      <img src="unnamed.jpg" alt="Beast Machine Logo" class="logo">
      <h1>Beast <span>Machine</span></h1>
      <p class="tagline">Desarrollamos productos digitales que transforman ideas en experiencias reales.</p>

      <div class="services">
        <div class="service">
          <span class="service-icon">&#9000;</span>
          <h3>Apps & Plataformas</h3>
        </div>
        <div class="service">
          <span class="service-icon">&#9881;</span>
          <h3>Software a Medida</h3>
        </div>
        <div class="service">
          <span class="service-icon">&#9889;</span>
          <h3>Automatizaciones</h3>
        </div>
      </div>

      <a href="mailto:gabriel@worker.ar" class="cta-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/>
        </svg>
        gabriel@worker.ar
      </a>
    </section>

    <footer>
      &copy; 2026 Beast Machine. Todos los derechos reservados.
    </footer>
  </div>
</body>
</html>
